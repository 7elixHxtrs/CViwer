name: Crear .exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Compilar
        run: >
          python -m PyInstaller --onefile --noconsole --icon icono.ico
          --add-data "icono.png;." --name CViwer
          --collect-all pygrabber --collect-all sounddevice --collect-all imageio_ffmpeg
          --hidden-import comtypes.stream --hidden-import PIL._tkinter_finder cviwer.py

      - uses: actions/upload-artifact@v4
        with:
          name: CViwer
          path: dist/CViwer.exe

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CViwer.exe
